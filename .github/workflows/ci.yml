name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The scripts claim bash 3.2 / BSD portability in their headers; the
    # macOS leg checks the BSD side, the Ubuntu leg the GNU side.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # macOS's default TMPDIR is a per-session path under
      # /var/folders/.../T/, itself a symlink into /private/var/folders/...
      # -- fixtures.sh's own `cd "$root" && pwd -P` resolves that symlink,
      # so a test that expects the raw, pre-resolution path (as several do)
      # sees a mismatch that never happens on Linux's unsymlinked /tmp. The
      # project's own verification gate (tmp/merge-6.2/README.md) points
      # macOS at /private/tmp specifically to avoid this; do the same here.
      - run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR=/private/tmp; fi
          bash scripts/test.sh
      # Single-byte locales are where bash 3.2 and awk stop agreeing with
      # UTF-8 source: the leading byte of "—" is the letter "â" in
      # Latin-1, so an unbraced $var absorbs it into the variable name and
      # [[:alnum:]] counts it as a word. Both bugs shipped green under a
      # UTF-8 locale and failed on the runner. ISO8859-1 is present on the
      # macOS images without generating a locale.
      - if: runner.os == 'macOS'
        run: TMPDIR=/private/tmp LC_ALL=en_US.ISO8859-1 bash scripts/test.sh
      - run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export TMPDIR=/private/tmp; fi
          LC_ALL=C bash scripts/test.sh

  shellcheck:
    # Gated at warning severity: the info-level findings (SC2015 pass/fail
    # idiom in test.sh, SC2329/SC2094 trap and redirect false positives)
    # are deliberate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # One shellcheck per file instead of one process for the whole set:
      # scripts/test.sh alone is ~10k lines and shellcheck prints nothing
      # until it finishes analyzing everything handed to it, so the single-
      # invocation form goes silent for the whole run. Looping gives a
      # progress line per file, which is cheap and easier to debug either
      # way.
      - run: |
          status=0
          for f in scripts/*.sh evals/*.sh; do
            echo "shellcheck: $f"
            shellcheck --severity=warning "$f" || status=1
          done
          exit "$status"
