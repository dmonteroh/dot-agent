# Parsed as data by verify.sh; shell syntax is not evaluated.
CHECK_DRIVER=.agent/scripts/checks.sh
POSITIVE_TEST_CHECKS=test
TEST_COUNT_FORMAT=tap
TIMEOUT_SECONDS=300
#
# Check output over this many bytes prints the lines matching
# OUTPUT_FAILURE_PATTERN first, then as many last lines as fit, and keeps the
# full output under .agent/.state/output/. With TEST_COUNT_FORMAT=tap, the
# failing TAP results come before the other matching lines. The default is the harness
# tool-result cap PAYLOAD_MAX_BYTES defaults to (30000), less a chosen 1000
# bytes for the receipt record:
# OUTPUT_MAX_BYTES=29000
#
# An awk extended regular expression, matched per line (chosen default):
# OUTPUT_FAILURE_PATTERN=not ok|FAIL|Error|ERROR|error:|Exception|Traceback|panic:|[Aa]ssert
