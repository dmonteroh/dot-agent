# .agent/scripts/review.conf — narrow lexical review-candidate detectors.
# Plain KEY=value, parsed and never executed. A repeated key uses its first line.

# Space-separated project-relative roots containing source files.
SOURCE_ROOTS=src

# Extended regular expression matching test paths.
TEST_PATH_RE=(^|/)(test|tests|spec|specs)/|(^|/)[^/]*(test|spec)\.[^/]+$

# auto discovers .agent/docs/*catalog*.md. Otherwise use space-separated paths.
CATALOGS=auto

# Maximum ordinary candidate lines printed after the comment gate. Must be > 0;
# a separate FINDINGS_TRUNCATED line is printed when additional candidates exist.
MAX_FINDINGS=20
