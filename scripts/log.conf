# .agent/scripts/log.conf — per-node options for the session-log writer.
# Plain KEY=value, parsed and never executed. `#` lines are comments.
# Node-owned: node.sh update seeds this file only when it is absent and
# never overwrites it — tune here, not in log.sh, whose edits the next
# update discards.
#
# Format: a whole `#` line is a comment, and nothing else is. There is no
# inline comment — everything after `=` to the end of the line is the value,
# so `SUMMARY_MAX_WORDS=25 words` sets the value to `25 words`. The ceiling
# takes digits only and the branch switch takes true or false; log.sh
# refuses to run on anything else rather than write an entry with the word
# ceiling silently switched off.
#
# Stamp each scripted entry with the checked-out branch, read from git at
# write time (mechanical — never asked of the agent). Silently omitted
# when the project is not a git checkout. The stamp spends no summary
# budget: the word ceiling is enforced on --summary alone. true/false:
LOG_INCLUDE_BRANCH=false
#
# Summary word ceiling — the session-log header contract's format:
# SUMMARY_MAX_WORDS=25
