# .agent/scripts/status.conf — per-node overrides for the status check.
# Plain KEY=value, parsed and never executed. `#` lines are comments.
# Node-owned: node.sh update seeds this file only when it is absent and
# never overwrites it — tune here, not in status.sh, whose edits the next
# update discards. An uncommented line pins the value for this node.
# Commented lines show the shipped default and keep tracking the script
# until uncommented.
#
# Tools this project expects a session to have — the key most projects
# trim (drop what the project does not use):
PROBE_TOOLS=rg fd jq gh python3 curl tree
#
# Grooming thresholds: review triggers, not caps — nothing is ever refused
# for size. Each default below is either derived from another stated value
# or a chosen default, noted per line.
#
# Session log, archived past either (both chosen defaults — the log is read
# as a tail every session, so it is groomed as a working file, not grown):
# LOG_MAX_ENTRIES=120
# LOG_MAX_WORDS=5000
#
# One entry: the header contract's format is 25 words. 50 is that ceiling
# with 2x grace. An entry is everything from its `- [` marker to the next,
# so a hand-wrapped narrative counts whole:
# LOG_ENTRY_MAX_WORDS=50
#
# One fact file, body words (chosen default, set well above one fact's
# natural size — a flag reads as "probably more than one fact"):
# MEMORY_MAX_WORDS=300
#
# Memory index entries (chosen default — grooming regulates the index, the
# cap does not):
# MEMORY_MAX_ENTRIES=100
#
# learned.md is always-loaded with no disclosure tier, so every word is
# paid every session. 60 rules is a chosen default. The word trigger is
# that ceiling times the file's own ~40-word entry target, so it fires
# first when entries bloat past that target:
# LEARNED_MAX_RULES=60
# LEARNED_MAX_WORDS=2400
#
# One area doc, body words (chosen default):
# DOCS_MAX_WORDS=2000
#
# Session-log entries printed on every run (chosen default):
# TAIL_LINES=25
