# .agent/scripts/comments.conf — the comment gate's node vocabulary.
# Plain KEY=value, parsed and never executed. `#` lines are comments, and
# every key it reads is listed below. Node-owned: edit or delete
# freely — node.sh update seeds this file only when it is absent and
# never overwrites it.
#
# Starter vocabulary: acceptance-criteria and question numbers (AC-12,
# Q3) cite task briefs a fresh clone cannot open. Drop or replace the
# line if your workflow does not number work this way.
BLOCK_RE_EXTRA=(^|[^[:alnum:]])AC-?[0-9]|(^|[^[:alnum:]])Q[0-9]+([^[:alnum:]]|$)
#
# Extensions the gate scans — the shipped default, listed live so
# trimming it to your stack is a conf edit, not a script edit:
EXTENSIONS=ts tsx js jsx mjs cs java kt go rs rb py sh bash css scss less html vue svelte c h cc cpp hpp swift php sql
#
# Paths the gate skips — the shipped default, shown so replacing it is an
# edit rather than an invention. Hidden directories go generically: an AI
# tool's or an editor's own directory holds hooks and helpers the comment
# rule was never aimed at, and naming the ones we can think of today would
# miss whichever arrives next. Uncomment and edit to review some of them
# again — .github/ scripts, say. EXCLUDE_RE replaces this list, and
# EXCLUDE_RE_EXTRA is ORed onto it:
# EXCLUDE_RE=(^|/)\.[^/]+/|(^|/)node_modules/|/dist/|/vendor/|\.min\.
#
# Other keys, commented out until needed:
# BASE_REF=origin/dev
# EXCLUDE_RE_EXTRA=/types/generated/|(^|/)Migrations/
# PRAGMA_RE_EXTRA=noinspection
