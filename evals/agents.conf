# evals/agents.conf — the agents an eval run can drive, and how to drive them.
#
# Plain KEY=value, parsed and never executed, the same as every conf in the
# node. `#` opens a comment on its own line and nowhere else: everything after
# `=` is the raw value.
#
# Nothing here is guessed. Each command line is the one YOU run, and it ships
# commented so a run cannot silently drive the wrong binary, the wrong model,
# or a model you are not paying for. Uncomment the arm you are running and put
# your own install's flags in it. run.sh refuses an arm whose command is unset
# rather than inventing one.
#
# Placeholders run.sh substitutes:
#   {prompt}    the eval's verbatim prompt, shell-quoted
#   {cwd}       the fixture directory the session runs in
#   {model}     the arm's MODEL value
#
# Two hard requirements on whatever command you supply:
#
#   1. It must run non-interactively and exit, or the run hangs.
#   2. Its stdout must be capturable. If it can emit a machine-readable
#      record of its tool calls, point TRACE_CMD at that; without one, the
#      11 trace assertions in spec.json cannot be graded and run.sh says so
#      rather than scoring them.
#
# ---------------------------------------------------------------------------
# ARM: claude — the reference deployment
# ---------------------------------------------------------------------------
# The Claude Code CLI runs headless with -p and can stream structured events.
# Fill in the exact invocation your install uses, including the model id.
# Check `claude --help` on your machine rather than trusting this comment:
# flags move between versions and a stale one here fails the whole run.
#
# CLAUDE_MODEL=claude-opus-5
# CLAUDE_CMD=claude -p {prompt} --model {model} --output-format stream-json --verbose
# CLAUDE_TRACE=stream-json
#
# ---------------------------------------------------------------------------
# ARM: codex — the harness where the bootstrap-repetition failure was seen
# ---------------------------------------------------------------------------
# bootstrap-once is the eval that needs this arm. It is the one failure in the
# set that was never reproduced on Claude Code, so a run without this arm
# leaves that eval measuring nothing.
#
# CODEX_MODEL=gpt-5.6
# CODEX_CMD=codex exec {prompt} --model {model}
# CODEX_TRACE=none
#
# ---------------------------------------------------------------------------
# ARM: a third harness
# ---------------------------------------------------------------------------
# Any agent that takes a prompt, runs in a directory, and exits. Cursor's CLI,
# an SDK script of your own, a colleague's harness. The eval set is corpus
# text and shell scripts, so nothing in it is Claude-specific.
#
# OTHER_MODEL=
# OTHER_CMD=
# OTHER_TRACE=none
#
# ---------------------------------------------------------------------------
# Run-wide settings
# ---------------------------------------------------------------------------
# Repeats per cell. One gives no variance estimate and every assertion buckets
# as stable whether it is or not; three is the smallest number that can show a
# split. Whatever you pick is a chosen budget and rollup.sh records it:
REPEATS=1
#
# Seconds before a run is abandoned. An agent that hangs on a permission
# prompt would otherwise stall the whole iteration:
TIMEOUT=900
