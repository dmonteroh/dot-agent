# evals/agents.conf — how run.sh finds and drives the agents an eval run
# can use.
#
# Plain KEY=value, parsed and never executed, the same as every conf in the
# node. `#` opens a comment on its own line and nowhere else: everything
# after `=` is the raw value.
#
# claude and codex are driven directly by run.sh: it resolves the binary,
# builds an argument array itself, and streams the eval's turns into it.
# There is no command-line template for either — nothing here can silently
# aim a wrong flag at the wrong binary — so CLAUDE_* and CODEX_* ship with
# the reference model and effort filled in, and BIN=auto, which resolves
# against whatever is actually on this machine's PATH (or, for Codex, the
# desktop app's bundled CLI) rather than a path baked in here.
#
# ---------------------------------------------------------------------------
# ARM: claude — the reference deployment
# ---------------------------------------------------------------------------
# BIN: a bare name resolved on PATH, an absolute path, or "auto" (PATH only,
# for symmetry with Codex's auto — Claude Code has no separate desktop-app
# CLI to fall back to). Check `claude --version` on your machine if a run
# reports it as not ready: flags and defaults move between CLI versions.
#
CLAUDE_BIN=claude
CLAUDE_MODEL=claude-sonnet-5
CLAUDE_EFFORT=medium
#
# ---------------------------------------------------------------------------
# ARM: codex — the harness where the bootstrap-repetition failure was seen
# ---------------------------------------------------------------------------
# bootstrap-once is the eval that needs this arm. It is the one failure in
# the set that was never reproduced on Claude Code, so a run without this arm
# leaves that eval measuring nothing.
#
# BIN=auto resolves the PATH binary first. run.sh probes each candidate's
# global, exec, and resume help before accepting it. A binary must advertise
# every flag the adapter uses, including --ignore-user-config. If the PATH
# binary is incompatible, auto tries CODEX_APP_BIN and then the ChatGPT app's
# standard bundled path. Leave CODEX_APP_BIN blank to skip that custom path.
#
CODEX_BIN=auto
# CODEX_APP_BIN=/Applications/Codex.app/Contents/MacOS/codex
CODEX_MODEL=gpt-5.6-terra
CODEX_EFFORT=medium
#
# ---------------------------------------------------------------------------
# Run-wide settings
# ---------------------------------------------------------------------------
# Repeats per cell. run.sh loops this many repeat run directories itself,
# each with its own fixture and run id, all *inside* the one iteration-<n>
# directory the invocation targets (--iteration, default 1). --iteration
# selects which iteration this invocation targets; it never reduces the
# repeat count — only --dry-run does that, to exactly one. One repeat gives
# no variance estimate and every assertion buckets as stable whether it is
# or not; three is the smallest number that can show a split. Whatever you
# pick is a chosen budget and rollup.py records it:
REPEATS=1
#
# Seconds before a run — or, for Claude, the whole multi-turn session — is
# abandoned. An agent that hangs on a permission prompt would otherwise
# stall the whole iteration:
TIMEOUT=900
